name: Node.js CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi
      - name: Build
        run: npm run build
      - name: Run noninteractive tests
        run: |
          node --experimental-sqlite --experimental-default-type=module --test cloudflare/*.test.mjs
