name: Marketplace Cloudflare deployment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify deploy configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-preflight.mjs --deploy
      - name: Verify Worker syntax and payment tests
        run: |
          for file in cloudflare/*.js; do node --check --experimental-default-type=module "$file"; done
          node --experimental-default-type=module --test cloudflare/*.test.mjs
          node --experimental-sqlite --test cloudflare/d1-lifecycle.test.mjs
      - name: Deploy Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Check configured Worker health
        env:
          WORKER_HEALTH_URL: ${{ vars.DOMISLINKER_WORKER_HEALTH_URL }}
        run: |
          if [ -z "$WORKER_HEALTH_URL" ]; then echo "DOMISLINKER_WORKER_HEALTH_URL is required"; exit 1; fi
          curl --fail --show-error --silent --retry 3 "$WORKER_HEALTH_URL/api/ready"
